services:
  - type: web
    name: graphmind-api
    runtime: docker
    plan: 0.5c-512mb
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    disk:
      name: graphmind-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/graphmind.db
      - key: TREE_SITTER_CACHE_DIR
        value: /var/data/parsers
      - key: FRONTEND_ORIGIN
        sync: false
