services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      FRONTEND_ORIGIN: http://localhost:3000
      DATABASE_PATH: /app/data/graphmind.db
      TREE_SITTER_CACHE_DIR: /app/data/parsers
    volumes:
      - graphmind-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
volumes:
  graphmind-data:
